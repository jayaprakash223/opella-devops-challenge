name: Terraform CI

on:
  pull_request:
    paths:
      - 'envs/**'
      - 'modules/**'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to apply (dev or prod)"
        default: dev

jobs:
  plan:
    name: Plan (dev & prod)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init, Fmt, Validate, Plan
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform init -input=false -reconfigure
          terraform fmt -check -recursive
          terraform validate
          terraform plan -out=tfplan -input=false -var-file=terraform.tfvars

      - name: TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint envs/${{ matrix.env }}

      - name: tfsec Scan
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          tfsec envs/${{ matrix.env }}

      - name: Save plan output
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: envs/${{ matrix.env }}/tfplan*

  apply_dev:
    name: Apply to Dev
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: plan-dev

      - name: Apply saved plan
        working-directory: envs/dev
        run: |
          terraform init -input=false -reconfigure
          cp ../../plan-dev/tfplan ./tfplan
          terraform apply -input=false -auto-approve tfplan

  apply_prod:
    name: Apply to Prod (requires approval)
    runs-on: ubuntu-latest
    environment: production
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: plan-prod

      - name: Apply saved plan
        working-directory: envs/prod
        run: |
          terraform init -input=false -reconfigure
          cp ../../plan-prod/tfplan ./tfplan
          terraform apply -input=false -auto-approve tfplan
