name: Terraform CI

on:
  pull_request:
    paths:
      - 'envs/**'
      - 'modules/**'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to apply (dev or prod)'
        required: false
        default: 'dev'

jobs:
  plan:
    name: Plan (dev & prod)
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Init & Plan for ${{ matrix.env }}
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform plan -out=tfplan -input=false

      - name: Save plan output for ${{ matrix.env }}
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Upload plan artifact for ${{ matrix.env }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: envs/${{ matrix.env }}/tfplan*

  apply_dev:
    name: Apply to Dev
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    needs: plan
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/deploy/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Init and apply dev
        working-directory: envs/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

  apply_prod:
    name: Apply to Prod (requires approval)
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    needs: plan
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/deploy/')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.0'

      - name: Init and apply prod
        working-directory: envs/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
